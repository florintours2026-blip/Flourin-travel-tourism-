<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Your Trip | FLORIN Travel</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="stylesheet" href="assets/css/booking.css">

</head>

<body>

    <main class="booking-page">

        <div class="booking-container">

            <div class="booking-header">

                <img
                    src="assets/images/logo/logo.png"
                    alt="FLORIN Travel"
                    class="booking-logo">

                <h1>Book Your Trip</h1>

                <p>

                    Complete the form below and our travel experts will contact you shortly.

                </p>

            </div>

<form id="bookingForm" class="booking-form">

    <h2>Customer Information</h2>

    <div class="form-grid">

        <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email">
        </div>

        <div class="form-group">
            <label for="country">Country</label>

            <select id="country">

                <option value="">Select Country</option>

                <option>Egypt</option>
                <option>Saudi Arabia</option>
                <option>United Arab Emirates</option>
                <option>Kuwait</option>
                <option>Qatar</option>
                <option>Bahrain</option>
                <option>Oman</option>
                <option>Jordan</option>
                <option>Iraq</option>
                <option>Libya</option>

            </select>

        </div>

    </div>

    <h2>Service Details</h2>

    <div class="form-grid">

        <div class="form-group">

            <label for="service">Required Service</label>

            <select id="service" required>

                <option value="">Select Service</option>

                <option value="flight">✈ Flight Booking</option>

                <option value="hotel">🏨 Hotel Booking</option>

                <option value="tour">🌍 Tour Package</option>

                <option value="umrah">🕋 Umrah</option>

                <option value="visa">📄 Visa</option>

                <option value="security">🛡 Security Clearance</option>

            </select>

        </div>

        <div class="form-group">

            <label for="destination">Destination</label>

            <select id="destination">

                <option value="">Select Destination</option>

                <option>Dubai</option>

                <option>Istanbul</option>

                <option>Maldives</option>

                <option>Makkah</option>

                <option>Madinah</option>

                <option>Cairo</option>

                <option>Sharm El Sheikh</option>

                <option>Paris</option>

                <option>London</option>

            </select>

        </div>

        <div class="form-group">

            <label for="travelDate">Travel Date</label>

            <input type="date" id="travelDate">

        </div>

        <div class="form-group">

            <label for="travelers">Number of Travelers</label>

            <input
                type="number"
                id="travelers"
                value="1"
                min="1">

        </div>

    </div>

    <div id="dynamicFields"></div>

    <div class="form-group">

        <label for="notes">

            Special Requests / Notes

        </label>

        <textarea
            id="notes"
            rows="6"></textarea>

    </div>

    <button
        type="submit"
        class="booking-btn">

        Submit Booking Request

    </button>

</form>

        </div>

    </main>

    <script type="module" src="assets/js/auth-guard.js"></script>

    <script type="module" src="assets/js/booking.js"></script>

</body>

  </html>
