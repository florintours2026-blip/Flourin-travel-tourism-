<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب حجز | FLORIN</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/florin-v2.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="logo" href="index.html"><img src="assets/images/logo/logo.png" alt="FLORIN"></a><nav class="main-nav"><a href="index.html">الرئيسية</a><a href="flights.html">الطيران</a><a href="offers.html">الفنادق والعروض</a><a class="active" href="booking.html">طلب حجز</a><a href="visas.html">التأشيرات</a></nav><div class="nav-actions"><span id="welcomeUser" class="welcome-user"></span><button id="themeToggle">◐</button><button id="langToggle">العربية <span>EN</span></button><button class="mobile-menu">☰</button></div></div></header>
<main class="booking-page"><div class="booking-container"><div class="booking-header"><img class="booking-logo" src="assets/images/logo/logo.png" alt="FLORIN"><span class="eyebrow">FLORIN REQUEST CENTER</span><h1>أرسل طلب الحجز</h1><p id="selectedOfferText">أدخل بياناتك، وسيتواصل فريق فلورين لتأكيد التوفر والسعر والتفاصيل.</p></div><form id="bookingForm" class="booking-form"><div><h2>بيانات العميل</h2><div class="form-grid"><div class="form-group"><label for="fullName">الاسم الكامل *</label><input id="fullName" required autocomplete="name"></div><div class="form-group"><label for="phone">الهاتف / واتساب *</label><input id="phone" required type="tel" autocomplete="tel"></div><div class="form-group"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email"></div><div class="form-group"><label for="country">دولة الإقامة</label><input id="country" autocomplete="country-name"></div></div></div><div><h2>تفاصيل الرحلة أو الخدمة</h2><div class="form-grid"><div class="form-group"><label for="service">الخدمة *</label><select id="service" required><option value="">اختر الخدمة</option><option value="flight">حجز طيران</option><option value="hotel">حجز فندق</option><option value="tour">بكج سياحي</option><option value="umrah">عمرة</option><option value="visa">تأشيرة</option><option value="security">موافقة أمنية</option><option value="family-visit">زيارة عائلية بمصر</option></select></div><div class="form-group"><label for="destination">الوجهة</label><input id="destination" placeholder="مثال: القاهرة أو KUL"></div><div class="form-group"><label for="travelDate">تاريخ السفر</label><input id="travelDate" type="date"></div><div class="form-group"><label for="travelers">عدد المسافرين</label><input id="travelers" type="number" min="1" value="1"></div></div></div><div id="airportFields" class="form-grid" hidden><div class="form-group"><label for="bookingFrom">مطار المغادرة (الاسم أو IATA)</label><input id="bookingFrom" data-airport-search placeholder="CAI أو القاهرة" autocomplete="off"></div><div class="form-group"><label for="bookingTo">مطار الوصول (الاسم أو IATA)</label><input id="bookingTo" data-airport-search placeholder="JED أو جدة" autocomplete="off"></div></div><div class="form-group"><label for="notes">تفاصيل إضافية</label><textarea id="notes" rows="6" placeholder="اكتب الفندق المفضل، شركة الطيران، نوع الغرفة، أو أي طلب خاص..."></textarea></div><input type="hidden" id="offerId"><input type="hidden" id="offerName"><input type="hidden" id="offerFrom"><input type="hidden" id="offerTo"><button class="booking-btn" type="submit"><i class="fa-solid fa-paper-plane"></i> إرسال الطلب</button><div class="booking-note">إرسال الطلب لا يعني تأكيد الحجز أو الدفع. يتم التأكيد بعد مراجعة التوفر والسعر من فريق فلورين.</div><div id="bookingStatus" class="booking-note"></div></form></div></main><script type="module" src="assets/js/main.js"></script><script type="module" src="assets/js/navbar-auth.js"></script><script type="module" src="assets/js/booking.js"></script></body></html>
