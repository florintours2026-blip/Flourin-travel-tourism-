<style>
.security-hero{background:linear-gradient(135deg,#0c4164,#08243b);padding:100px 0;color:#fff;text-align:center}
.security-hero h1{font-size:clamp(32px,5vw,56px);margin:14px 0}
.security-hero p{color:#c3d8e8;max-width:720px;margin:0 auto;font-size:17px;line-height:1.8}
.features-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:50px 0}
.feature-box{background:var(--f-card);border:1px solid var(--f-border);border-radius:20px;padding:28px 20px;text-align:center;box-shadow:var(--f-shadow)}
.feature-box .icon{width:60px;height:60px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(22,191,255,.15),rgba(22,191,255,.05));color:var(--f-primary);font-size:24px;border-radius:16px}
.feature-box h3{margin:0 0 8px;font-size:16px;color:var(--f-text)}
.feature-box p{color:var(--f-muted);font-size:13px;line-height:1.7;margin:0}
.steps-list{display:grid;gap:16px;margin:40px 0}
.step-item{display:flex;gap:20px;align-items:flex-start;background:var(--f-card);border:1px solid var(--f-border);border-radius:18px;padding:24px;box-shadow:var(--f-shadow)}
.step-num{flex-shrink:0;width:52px;height:52px;display:grid;place-items:center;background:linear-gradient(135deg,var(--f-primary),#147be8);color:#fff;font-size:20px;font-weight:800;border-radius:14px}
.step-item h4{margin:0 0 6px;font-size:17px;color:var(--f-text)}
.step-item p{margin:0;color:var(--f-muted);font-size:14px;line-height:1.7}
.cta-box{background:linear-gradient(135deg,var(--f-primary),#147be8);border-radius:22px;padding:48px 36px;text-align:center;color:#fff;margin:50px 0}
.cta-box h2{margin:0 0 12px;font-size:clamp(24px,4vw,36px)}
.cta-box p{margin:0 0 26px;opacity:.95;font-size:15px}
.cta-box .buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.cta-box .btn-white{background:#fff;color:var(--f-primary);padding:14px 28px;border-radius:12px;font-weight:800;font-size:15px;transition:.25s;display:inline-flex;align-items:center;gap:9px}
.cta-box .btn-white:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.25)}
.cta-box .btn-outline{background:transparent;color:#fff;border:2px solid #fff;padding:14px 28px;border-radius:12px;font-weight:800;font-size:15px;transition:.25s;display:inline-flex;align-items:center;gap:9px}
.cta-box .btn-outline:hover{background:#fff;color:var(--f-primary);transform:translateY(-3px)}
@media(max-width:900px){.features-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.features-grid{grid-template-columns:1fr}.step-item{flex-direction:column;text-align:center}.step-item .step-num{margin:0 auto}.cta-box{padding:36px 22px}}
</style>
</head>
