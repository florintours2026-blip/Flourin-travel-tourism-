<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تفاصيل العرض | FLORIN Travel & Tourism Agency</title>
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"><link rel="stylesheet" href="assets/css/offers.css">
</head><body><main class="details-wrap"><div class="container"><a class="back" href="offers.html">← العودة إلى العروض</a>
<div id="offerDetailsPage"></div></div></main>
<script type="module">
import {getOffer} from "./assets/js/offers-data.js";
const box=document.getElementById("offerDetailsPage");const id=new URLSearchParams(location.search).get("id")||"dubai";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const o=await getOffer(id);
if(!o){box.innerHTML="<p>العرض غير موجود أو تم إخفاؤه.</p>";}
else{document.title=o.name+" | FLORIN";box.innerHTML=`<div class="details"><section class="details-main"><span class="badge">${esc(o.category)}</span>
<h1>${esc(o.name)}</h1><div class="meta"><span>📍 ${esc(o.country)}</span><span>⏱️ ${esc(o.duration)}</span></div>
<p>${esc(o.description)}</p><div class="section-title">ماذا يشمل العرض؟</div><ul class="list">${(o.included||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
<div class="section-title">ما لا يشمل</div><ul class="list">${(o.excluded||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
<div class="section-title">ملاحظات مهمة</div><p class="note">${esc(o.notes)}</p></section>
<aside class="details-side"><div class="note">السعر</div><div class="price">${esc(o.price)}</div><p class="note">السعر النهائي والتوفر يتم تأكيدهما بعد مراجعة بيانات السفر.</p>
<a class="btn" href="booking.html?offer=${encodeURIComponent(o.id)}&offerName=${encodeURIComponent(o.name)}">احجز الآن يدويًا</a>
<a class="btn secondary" href="offers.html">عروض أخرى</a></aside></div>`}
</script></body></html>
