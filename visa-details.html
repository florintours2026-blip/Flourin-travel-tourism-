<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تفاصيل التأشيرة | FLORIN Travel & Tourism Agency</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css">
<style>
body{background:#061525;color:#fff;font-family:Cairo,Arial,Tahoma,sans-serif}.visa-page{min-height:100vh;padding:45px 0 90px}.container{width:min(1000px,92%);margin:auto}.back{color:#55b5ff;font-weight:700}.visa-card{margin-top:25px;background:#102b45;border:1px solid #ffffff12;border-radius:24px;overflow:hidden;display:grid;grid-template-columns:340px 1fr}.visa-image{min-height:420px;background:#0b2035}.visa-image img{width:100%;height:100%;object-fit:cover}.visa-content{padding:32px}.badge{display:inline-flex;gap:8px;align-items:center;padding:8px 13px;border-radius:999px;background:#0b2943;color:#55b5ff}.visa-content h1{font-size:clamp(30px,5vw,48px);margin:14px 0}.meta{display:flex;flex-wrap:wrap;gap:10px}.meta span{padding:9px 12px;background:#ffffff0b;border-radius:10px;color:#c7d8e8}.price{font-size:34px;color:#55b5ff;font-weight:900;margin:18px 0}.box{margin-top:20px;padding:18px;background:#0b2035;border-radius:15px;color:#c7d8e8;line-height:1.9}.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;background:#1e88e5;border-radius:14px;font-weight:800;margin-top:22px}.source{margin-top:15px;color:#8fa6ba;font-size:12px}@media(max-width:760px){.visa-card{grid-template-columns:1fr}.visa-image{min-height:260px}.visa-content{padding:22px}}
</style></head>
<body><main class="visa-page"><div class="container">
<a class="back" href="visas.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى التأشيرات</a>
<div id="app"><p>جاري التحميل...</p></div>
</div></main>
<script type="module">
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const id=new URLSearchParams(location.search).get("id");
const data=await fetch("assets/data/visas.json?v=20260906", { cache: "no-store" }).then(r=>{if(!r.ok) throw new Error("HTTP "+r.status); return r.json();});
const v=data.items.find(x=>x.id===id);
const app=document.getElementById("app");
if(!v){app.innerHTML="<div class='box'>التأشيرة غير موجودة.</div>";}
else{
document.title=v.country+" | التأشيرات | FLORIN";
app.innerHTML=`<article class="visa-card">
<div class="visa-image"><img src="${esc(v.flag)}" alt="علم ${esc(v.country)}" onerror="this.onerror=null;this.src='assets/images/logo/logo.png'"></div>
<div class="visa-content">
<span class="badge"><i class="fa-solid fa-passport"></i> ${esc(v.serviceType)}</span>
<h1>${esc(v.country)}</h1>
<div class="meta"><span><i class="fa-solid fa-earth-asia"></i> ${esc(v.region)}</span><span><i class="fa-solid fa-file-circle-check"></i> خدمة تأشيرة</span></div>
<div class="price">${esc(v.price)}</div>
<p>${esc(v.description)}</p>
<div class="box"><strong>ملاحظة مهمة</strong><br>${esc(v.notes)}</div>
<a class="btn" href="${esc(v.bookingLink)}"><i class="fa-solid fa-paper-plane"></i> ابدأ طلب التأشيرة</a>
<div class="source"><i class="fa-solid fa-circle-info"></i> السعر مدخل من قائمة الأسعار المقدمة للموقع، والتأكيد النهائي يتم بعد مراجعة بيانات المسافر.</div>
</div></article>`;
}
</script></body></html>
